# ==============================================================================
# GitLab CI/CD Pipeline - PKP Secure (Access Door Management)
# Runner Tag: Sandbox
# Stages:
#   1. test   : Automated test suite execution (php artisan test)
#   2. deploy : Docker Compose rebuild & container restart (branch main only)
# ==============================================================================

stages:
  - test
  - deploy

# ------------------------------------------------------------------------------
# Stage 1: Test (PHPUnit / Pest Test Suite)
# ------------------------------------------------------------------------------
test:
  stage: test
  image: php:8.2-cli
  tags:
    - Sandbox
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - vendor/
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq git zip unzip libsqlite3-dev libzip-dev libpng-dev libonig-dev
    - docker-php-ext-install zip pdo_sqlite mbstring bcmath
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - php artisan key:generate
    - php artisan test

# ------------------------------------------------------------------------------
# Stage 2: Deploy (Docker Compose Build & Container Restart)
# ------------------------------------------------------------------------------
deploy:
  stage: deploy
  image: docker:latest
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - docker compose down --remove-orphans || true
    - docker compose up -d --build
    - docker compose ps