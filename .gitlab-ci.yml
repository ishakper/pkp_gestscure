# ==============================================================================
# GitLab CI/CD Pipeline - PKP SecureGate
# ==============================================================================
# Pipeline Architecture:
#   .pre -> validate -> test -> security -> build -> deploy -> verify
#
# Quality Gate Rule:
#   Deployment is strictly prohibited until validate, test, security, and build
#   stages complete with 100% success on the protected default branch.
# ==============================================================================

stages:
  - .pre
  - validate
  - test
  - security
  - build
  - deploy
  - verify

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_COMMIT_SHA
  RUNNER_TAG: Sandbox

# ------------------------------------------------------------------------------
# Stage 0: Workspace Permission Fix (Essential for Shell Executor Runners)
# ------------------------------------------------------------------------------
fix_runner_workspace:
  stage: .pre
  tags:
    - Sandbox
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "Recovering workspace permissions from any prior root-owned Docker mounts..."
    - id
    - docker run --rm -v "$(pwd):/ws" alpine chown -R $(id -u):$(id -g) /ws 2>/dev/null || true
    - chmod -R u+rwX . 2>/dev/null || true
    - echo "Workspace permissions successfully restored."

# ------------------------------------------------------------------------------
# Stage 1: Validation
# ------------------------------------------------------------------------------
validate_composer:
  stage: validate
  image: composer:2
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "Validating composer configuration and lockfile..."
    - |
      if command -v composer >/dev/null 2>&1; then
        composer validate --strict --no-check-publish
      else
        docker run --rm -v "$(pwd):/app" -w /app composer:2 composer validate --strict --no-check-publish
      fi

validate_syntax:
  stage: validate
  image: php:8.2-cli-alpine
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "Checking PHP syntax across application source..."
    - |
      if command -v php >/dev/null 2>&1; then
        find app config database routes -type f -name "*.php" -exec php -l {} + | grep -v "No syntax errors detected" || true
      else
        docker run --rm -v "$(pwd):/app" -w /app php:8.2-cli-alpine sh -c 'find app config database routes -type f -name "*.php" -exec php -l {} + | grep -v "No syntax errors detected" || true'
      fi

# ------------------------------------------------------------------------------
# Stage 2: Automated Quality Test Suite
# ------------------------------------------------------------------------------
test_suite:
  stage: test
  image: php:8.2-cli-alpine
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  cache:
    key: composer-${CI_COMMIT_REF_SLUG}
    paths:
      - vendor/
  script:
    - echo "Executing full automated feature & regression test suite..."
    - |
      if command -v php >/dev/null 2>&1 && command -v composer >/dev/null 2>&1; then
        cp -n .env.example .env || true
        composer install --no-interaction --prefer-dist --optimize-autoloader
        php artisan key:generate --force
        php artisan test --colors=never
      else
        docker compose run --rm -e APP_ENV=testing app php artisan test --colors=never
        docker run --rm -v "$(pwd):/ws" alpine chown -R $(id -u):$(id -g) /ws 2>/dev/null || true
      fi
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths:
      - storage/logs/laravel.log

# ------------------------------------------------------------------------------
# Stage 3: Security & Secret Hygiene
# ------------------------------------------------------------------------------
security_hygiene:
  stage: security
  image: alpine:latest
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "Checking that .env is NOT tracked in Git..."
    - test -z "$(git ls-files .env)"
    - echo "Checking that no temporary debug/auth scripts are tracked..."
    - test -z "$(git ls-files run_auth.php public/run_auth.php scratch/* raw_*.php)"
    - echo "Verifying docker-compose.yml has no committed secret defaults..."
    - grep -F 'APP_KEY=${APP_KEY}' docker-compose.yml
    - test -z "$(grep -F 'APP_KEY=${APP_KEY:-base64:' docker-compose.yml)"
    - test -z "$(grep -F 'HIKVISION_ISAPI_PASSWORD=Hikvision@' docker-compose.yml)"
    - echo "Security hygiene checks passed cleanly."

# ------------------------------------------------------------------------------
# Stage 4: Container Build
# ------------------------------------------------------------------------------
build_docker:
  stage: build
  image: docker:latest
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - validate_composer
    - validate_syntax
    - test_suite
    - security_hygiene
  script:
    - echo "Building reproducible Docker image pkp-securegate:${IMAGE_TAG}..."
    - docker build -t pkp-securegate:${IMAGE_TAG} -t pkp-securegate:latest .
    - if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" && docker tag pkp-securegate:${IMAGE_TAG} "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" && docker tag pkp-securegate:latest "${CI_REGISTRY_IMAGE}:latest" && docker push "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" && docker push "${CI_REGISTRY_IMAGE}:latest"; fi

# ------------------------------------------------------------------------------
# Stage 5: Gated Production Deployment
# ------------------------------------------------------------------------------
deploy_production:
  stage: deploy
  image: docker:latest
  tags:
    - Sandbox
  environment:
    name: production
    url: $APP_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_docker
  script:
    - echo "Deploying to production target..."
    - mkdir -p database storage/logs storage/app storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
    - touch database/database.sqlite
    - chmod -R 777 storage bootstrap/cache database
    - docker compose up -d --force-recreate app
    - docker compose ps
    - docker run --rm -v "$(pwd):/ws" alpine chown -R $(id -u):$(id -g) /ws 2>/dev/null || true

# ------------------------------------------------------------------------------
# Stage 6: Post-Deployment Verification
# ------------------------------------------------------------------------------
verify_healthcheck:
  stage: verify
  image: curlimages/curl:latest
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - deploy_production
  script:
    - echo "Verifying container endpoint health..."
    - curl -s -f -o /dev/null -w "%{http_code}\n" "${APP_URL:-http://localhost:8080}/login"
    - echo "SecureGate deployment health check verified successfully."