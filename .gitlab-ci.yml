# ==============================================================================
# GitLab CI/CD Pipeline - PKP Secure (Access Door Management)
# Target Runner Tag: Sandbox
# ==============================================================================

stages:
  - deploy
  - test

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# ------------------------------------------------------------------------------
# Primary Job: Deploy to Sandbox Server (Docker Compose)
# ------------------------------------------------------------------------------
deploy:
  stage: deploy
  image: docker:latest
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - docker compose down --remove-orphans || true
    - docker compose up -d --build
    - docker compose ps

# ------------------------------------------------------------------------------
# Secondary Job: Automated Test Suite (Optional / Independent)
# ------------------------------------------------------------------------------
test:
  stage: test
  image: php:8.2-cli
  tags:
    - Sandbox
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
      allow_failure: true
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - vendor/
  before_script:
    - apt-get update -yqq
    - apt-get install -yqq git zip unzip libsqlite3-dev libzip-dev libpng-dev libonig-dev
    - docker-php-ext-install zip pdo_sqlite mbstring bcmath
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cp .env.example .env
    - composer install --no-interaction --prefer-dist --optimize-autoloader
    - php artisan key:generate
    - php artisan test