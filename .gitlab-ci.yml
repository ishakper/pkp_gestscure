# ==============================================================================
# GitLab CI/CD Pipeline - PKP SecureGate
# ==============================================================================
# Pipeline Architecture:
#   .pre -> validate -> build -> test -> security -> deploy -> verify
#
# Quality Gate Rule:
#   Deployment is strictly prohibited until validate, build, test, and security
#   stages complete with 100% success on the protected default branch.
# ==============================================================================

stages:
  - .pre
  - validate
  - build
  - test
  - security
  - deploy
  - verify

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_COMMIT_SHA
  RUNNER_TAG: Sandbox

# ------------------------------------------------------------------------------
# Stage 0: Workspace Permission Fix (Essential for Shell Executor Runners)
# ------------------------------------------------------------------------------
fix_runner_workspace:
  stage: .pre
  tags:
    - Sandbox
  variables:
    GIT_STRATEGY: none
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "Recovering workspace permissions from any prior root-owned Docker mounts..."
    - id
    - docker run --rm -v "$(pwd):/ws" alpine chown -R $(id -u):$(id -g) /ws 2>/dev/null || true
    - chmod -R u+rwX . 2>/dev/null || true
    - echo "Workspace permissions successfully restored."

# ------------------------------------------------------------------------------
# Stage 1: Validation
# ------------------------------------------------------------------------------
validate_composer:
  stage: validate
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "Validating composer configuration and lockfile..."
    - docker run --rm -v "$(pwd):/app" -w /app composer:2 composer validate --strict --no-check-publish

validate_syntax:
  stage: validate
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - echo "Checking PHP syntax across application source..."
    - docker run --rm -v "$(pwd):/app" -w /app php:8.2-cli-alpine sh -c 'find app config database routes -type f -name "*.php" -exec php -l {} + | grep -v "No syntax errors detected" || true'

# ------------------------------------------------------------------------------
# Stage 2: Container Build
# ------------------------------------------------------------------------------
build_docker:
  stage: build
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  needs:
    - validate_composer
    - validate_syntax
  script:
    - echo "Building reproducible Docker image pkp-securegate:${IMAGE_TAG}..."
    - docker build -t pkp-securegate:${IMAGE_TAG} -t pkp-securegate:latest .
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ]; then echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" && docker tag pkp-securegate:${IMAGE_TAG} "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" && docker tag pkp-securegate:latest "${CI_REGISTRY_IMAGE}:latest" && docker push "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" && docker push "${CI_REGISTRY_IMAGE}:latest"; fi

# ------------------------------------------------------------------------------
# Stage 3: Automated Quality Test Suite (Clean Container)
# ------------------------------------------------------------------------------
test_suite:
  stage: test
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  needs:
    - build_docker
  script:
    - echo "Executing full automated feature & regression test suite in clean container..."
    - docker run --rm --entrypoint /bin/sh -v "$(pwd):/var/www/html" -w /var/www/html -e APP_ENV=testing pkp-securegate:${IMAGE_TAG} -c "composer install --prefer-dist --no-interaction && php artisan test --colors=never"
    - docker run --rm -v "$(pwd):/ws" alpine chown -R $(id -u):$(id -g) /ws 2>/dev/null || true
  artifacts:
    when: on_failure
    expire_in: 3 days
    paths:
      - storage/logs/laravel.log

# ------------------------------------------------------------------------------
# Stage 4: Security & Secret Hygiene
# ------------------------------------------------------------------------------
security_hygiene:
  stage: security
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH
  needs:
    - test_suite
  script:
    - echo "Checking that .env is NOT tracked in Git..."
    - test -z "$(git ls-files .env)"
    - echo "Checking that no temporary debug/auth scripts are tracked..."
    - test -z "$(git ls-files run_auth.php public/run_auth.php scratch/* raw_*.php)"
    - echo "Verifying docker-compose.yml has no committed secret defaults..."
    - grep -F 'APP_KEY=${APP_KEY}' docker-compose.yml
    - test -z "$(grep -F 'APP_KEY=${APP_KEY:-base64:' docker-compose.yml)"
    - test -z "$(grep -F 'HIKVISION_ISAPI_PASSWORD=Hikvision@' docker-compose.yml)"
    - echo "Security hygiene checks passed cleanly."

# ------------------------------------------------------------------------------
# Stage 5: Gated Production Deployment (Deferred)
# ------------------------------------------------------------------------------
deploy_production:
  stage: deploy
  tags:
    - Sandbox
  environment:
    name: production
    url: $APP_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  needs:
    - security_hygiene
  script:
    - echo "Production deployment is currently deferred due to offline target infrastructure (192.168.90.81)."
    - echo "Triggering container recreation on runner host..."
    - mkdir -p database storage/logs storage/app storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache
    - touch database/database.sqlite
    - chmod -R 777 storage bootstrap/cache database
    - docker compose up -d --force-recreate app
    - docker compose ps
    - docker run --rm -v "$(pwd):/ws" alpine chown -R $(id -u):$(id -g) /ws 2>/dev/null || true

# ------------------------------------------------------------------------------
# Stage 6: Post-Deployment Verification (Deferred)
# ------------------------------------------------------------------------------
verify_healthcheck:
  stage: verify
  tags:
    - Sandbox
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  needs:
    - deploy_production
  script:
    - echo "Verifying container endpoint health..."
    - curl -s -f -o /dev/null -w "%{http_code}\n" "${APP_URL:-http://localhost:8080}/login"
    - echo "SecureGate deployment health check verified successfully."