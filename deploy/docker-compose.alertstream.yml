services:
  alertstream-door-b:
    extends:
      file: docker-compose.yml
      service: app

    container_name: pkp_securegate_alertstream_door_b

    image: ${PKP_IMAGE:-pkp-securegate:50d808b585cf97107d54bc2b7e62c03fe01d76e0}

    entrypoint:
      - php

    command:
      - artisan
      - door:stream-events
      - DOOR-B

    ports: !reset []

    healthcheck:
      disable: true

    restart: unless-stopped
