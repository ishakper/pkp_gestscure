services:
  app:
    environment:
      - APP_ENV=testing
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=pgsql
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-securegate_test}
      - DB_USERNAME=${DB_USERNAME:?Set DB_USERNAME in .env}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - HIKVISION_MOCK_MODE=true
      - HIKVISION_ISAPI_USE_MOCK=true
      - LOG_LEVEL=debug
    volumes:
      - ./tests:/var/www/html/tests

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: verification
    image: pkp-securegate-verify:latest
    command: ["vendor/bin/phpunit", "--colors=never"]
