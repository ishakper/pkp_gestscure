name: gatescure_uat

services:
  app_uat:
    build:
      context: .
      dockerfile: Dockerfile
    image: pkp-securegate-uat:latest
    container_name: pkp_securegate_uat_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    environment:
      - APP_ENV=uat
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db_uat
      - DB_PORT=5432
      - DB_DATABASE=securegate_uat
      - DB_USERNAME=securegate
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis_uat
      - REDIS_PORT=6379
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - HIKVISION_MOCK_MODE=true
      - HIKVISION_ISAPI_USE_MOCK=true
      - HIKVISION_ISAPI_MOCK_BASE_URL=http://127.0.0.1/api/mock/isapi
      - APP_KEY=${APP_KEY:?APP_KEY is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - RUN_MIGRATIONS=false
    command: ["sh", "-c", "exec supervisord -c /etc/supervisor/conf.d/supervisord.conf"]
    volumes:
      - ./storage/logs:/var/www/html/storage/logs
      - ./storage/app:/var/www/html/storage/app
    depends_on:
      db_uat:
        condition: service_healthy
      redis_uat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M
    networks:
      - uat_isolated_net

  db_uat:
    image: postgres:16-alpine
    container_name: pkp_securegate_uat_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securegate_uat
      POSTGRES_USER: securegate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - uat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securegate -d securegate_uat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    networks:
      - uat_isolated_net

  redis_uat:
    image: redis:7-alpine
    container_name: pkp_securegate_uat_redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - uat_redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    networks:
      - uat_isolated_net

networks:
  uat_isolated_net:
    internal: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.29.90.0/24
          gateway: 172.29.90.1
    labels:
      network.type: "uat-isolated"
      physical.egress: "blocked"

volumes:
  uat_pgdata:
  uat_redisdata:
