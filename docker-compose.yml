services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pkp-securegate:latest
    container_name: pkp_securegate_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - APP_NAME=PKP Secure
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - APP_TIMEZONE=Asia/Jakarta
      - HIKVISION_LISTENER_IP=${HIKVISION_LISTENER_IP:-192.168.90.64}
      - HIKVISION_LISTENER_PORT=${HIKVISION_LISTENER_PORT:-8080}
      - LOG_CHANNEL=stack
      - LOG_LEVEL=info
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - BROADCAST_DRIVER=log
      - CACHE_DRIVER=file
      - FILESYSTEM_DISK=local
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - HIKVISION_MOCK_MODE=false
      - HIKVISION_ISAPI_USE_MOCK=false
      - DOOR_B_IP=${DOOR_B_IP}
      - DOOR_B_USER=${DOOR_B_USER}
      - DOOR_B_PASS=${DOOR_B_PASS}
      - DOOR_B_WEBHOOK_SECRET=${DOOR_B_WEBHOOK_SECRET}
      - ALLOWED_DEVICE_IPS=${ALLOWED_DEVICE_IPS:-192.168.90.15,172.25.0.1}
      - HIKVISION_ISAPI_HOST=${HIKVISION_ISAPI_HOST:-${DOOR_B_IP:-192.168.90.15}}
      - HIKVISION_ISAPI_PORT=${HIKVISION_ISAPI_PORT:-80}
      - HIKVISION_ISAPI_USERNAME=${HIKVISION_ISAPI_USERNAME:-admin}
      - HIKVISION_ISAPI_PASSWORD=${HIKVISION_ISAPI_PASSWORD:-}
      - HIKVISION_ISAPI_MOCK_BASE_URL=${HIKVISION_ISAPI_MOCK_BASE_URL:-}
      - ISAPI_DEVICE_SECRET=${ISAPI_DEVICE_SECRET:-}
      - ISAPI_CONNECT_TIMEOUT=${ISAPI_CONNECT_TIMEOUT:-5}
      - ISAPI_REQUEST_TIMEOUT=${ISAPI_REQUEST_TIMEOUT:-10}
    volumes:
      # Persistent SQLite database folder
      - ./database:/var/www/html/database
      # Persistent application & worker logs
      - ./storage/logs:/var/www/html/storage/logs
      # Persistent uploaded files / storage app
      - ./storage/app:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - securegate-net

networks:
  securegate-net:
    driver: bridge