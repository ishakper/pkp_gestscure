services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pkp-securegate:latest
    container_name: pkp_securegate_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      - APP_NAME=PKP Secure
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY:-base64:309l7r53f5qO2cZ7X8hYlqV1V6C5q8j+7p7+9n9=placeholder}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - APP_TIMEZONE=Asia/Jakarta
      - LOG_CHANNEL=stack
      - LOG_LEVEL=info
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/database/database.sqlite
      - BROADCAST_DRIVER=log
      - CACHE_DRIVER=file
      - FILESYSTEM_DISK=local
      - QUEUE_CONNECTION=database
      - SESSION_DRIVER=file
      - SESSION_LIFETIME=120
      - HIKVISION_MOCK_MODE=true
      - HIKVISION_ISAPI_USE_MOCK=true
      - HIKVISION_ISAPI_HOST=192.168.90.11
      - HIKVISION_ISAPI_PORT=80
      - HIKVISION_ISAPI_USERNAME=admin
      - HIKVISION_ISAPI_PASSWORD=Hikvision@DoorA
      - HIKVISION_ISAPI_MOCK_BASE_URL=http://localhost:8000/api/mock/isapi
      - ISAPI_DEVICE_SECRET=secret_simulator_key_2026
      - ISAPI_CONNECT_TIMEOUT=5
      - ISAPI_REQUEST_TIMEOUT=10
    volumes:
      # Persistent SQLite database file
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
      # Persistent application & worker logs
      - ./storage/logs:/var/www/html/storage/logs
      # Persistent uploaded files / storage app
      - ./storage/app:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - securegate-net

networks:
  securegate-net:
    driver: bridge
