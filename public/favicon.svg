<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12"/>
  
  <!-- Subtle Internal Glow -->
  <rect x="26" y="26" width="460" height="460" rx="106" fill="url(#centerGlow)"/>

  <!-- Outer Shield Crest -->
  <path d="M 256, 68 
           C 340, 68 400, 112 400, 192 
           C 400, 320 270, 420 256, 432 
           C 242, 420 112, 320 112, 192 
           C 112, 112 172, 68 256, 68 Z" 
        fill="#0f1d3a" 
        fill-opacity="0.82" 
        stroke="url(#borderGrad)" 
        stroke-width="10" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Inner High-Tech Gate Arcs (Biometric waves) -->
  <path d="M 175, 185 C 175, 140 210, 115 256, 115 C 302, 115 337, 140 337, 185" 
        fill="none" 
        stroke="url(#cyanGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-dasharray="8 6"/>

  <path d="M 198, 195 C 198, 162 224, 142 256, 142 C 288, 142 314, 162 314, 195" 
        fill="none" 
        stroke="#6366f1" 
        stroke-width="6" 
        stroke-linecap="round"/>

  <!-- Lock Shackle & Keyhole Emblem (Top of Monogram) -->
  <circle cx="256" cy="180" r="14" fill="url(#goldGrad)"/>
  <path d="M 252, 180 L 248, 204 L 264, 204 L 260, 180 Z" fill="url(#goldGrad)"/>

  <!-- PKP Monogram (Bold, Crisp, Futuristic Typography) -->
  <g id="pkp-monogram">
    <!-- P -->
    <path d="M 152, 235 L 188, 235 C 208, 235 220, 246 220, 263 C 220, 280 208, 291 188, 291 L 174, 291 L 174, 335 L 152, 335 Z M 174, 253 L 174, 273 L 186, 273 C 196, 273 200, 268 200, 263 C 200, 258 196, 253 186, 253 Z" 
          fill="url(#cyanGrad)" stroke="#0b1329" stroke-width="2"/>

    <!-- K -->
    <path d="M 234, 235 L 256, 235 L 256, 274 L 282, 235 L 308, 235 L 273, 284 L 310, 335 L 283, 335 L 256, 295 L 256, 335 L 234, 335 Z" 
          fill="#ffffff" stroke="#0b1329" stroke-width="2"/>

    <!-- P -->
    <path d="M 324, 235 L 360, 235 C 380, 235 392, 246 392, 263 C 392, 280 380, 291 360, 291 L 346, 291 L 346, 335 L 324, 335 Z M 346, 253 L 346, 273 L 358, 273 C 368, 273 372, 268 372, 263 C 372, 258 368, 253 358, 253 Z" 
          fill="url(#cyanGrad)" stroke="#0b1329" stroke-width="2"/>
  </g>

  <!-- SecureGate Badge Ribbon / Wordmark -->
  <rect x="166" y="356" width="180" height="26" rx="13" fill="#080e1e" stroke="url(#cyanGrad)" stroke-width="3"/>
  <text x="256" y="373" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="3">SECUREGATE</text>

  <!-- Accent Status Light at bottom apex of shield -->
  <circle cx="256" cy="406" r="7" fill="#10b981" filter="url(#neonGlow)"/>
</svg>
